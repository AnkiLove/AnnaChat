name: AnnaChat
version: '${version}'
main: dev.annachat.AnnaChat
description: 面向 Paper 26.x 的模块化聊天管理插件
api-version: '26.1'
load: POSTWORLD
folia-supported: true
softdepend:
  - PlaceholderAPI
  - LuckPerms
commands:
  annachat:
    description: AnnaChat 主命令
    usage: /annachat help
    aliases: [ ac, achat ]
permissions:
  annachat.use:
    default: true
  annachat.channel.use.*:
    default: true
  annachat.command.channel:
    default: true
  annachat.command.toggle:
    default: true
  annachat.command.friend:
    default: true
  annachat.channel.use.global:
    default: true
  annachat.channel.use.local:
    default: true
  annachat.channel.use.friends:
    default: true
  annachat.chat.color:
    default: op
  annachat.chat.color.*:
    default: op
  "annachat.chat.color.&0":
    default: op
  "annachat.chat.color.&1":
    default: op
  "annachat.chat.color.&2":
    default: op
  "annachat.chat.color.&3":
    default: op
  "annachat.chat.color.&4":
    default: op
  "annachat.chat.color.&5":
    default: op
  "annachat.chat.color.&6":
    default: op
  "annachat.chat.color.&7":
    default: op
  "annachat.chat.color.&8":
    default: op
  "annachat.chat.color.&9":
    default: op
  "annachat.chat.color.&a":
    default: op
  "annachat.chat.color.&b":
    default: op
  "annachat.chat.color.&c":
    default: op
  "annachat.chat.color.&d":
    default: op
  "annachat.chat.color.&e":
    default: op
  "annachat.chat.color.&f":
    default: op
  annachat.chat.color.black:
    default: op
  annachat.chat.color.dark-blue:
    default: op
  annachat.chat.color.dark-green:
    default: op
  annachat.chat.color.dark-aqua:
    default: op
  annachat.chat.color.dark-red:
    default: op
  annachat.chat.color.dark-purple:
    default: op
  annachat.chat.color.gold:
    default: op
  annachat.chat.color.gray:
    default: op
  annachat.chat.color.dark-gray:
    default: op
  annachat.chat.color.blue:
    default: op
  annachat.chat.color.green:
    default: op
  annachat.chat.color.aqua:
    default: op
  annachat.chat.color.red:
    default: op
  annachat.chat.color.light-purple:
    default: op
  annachat.chat.color.yellow:
    default: op
  annachat.chat.color.white:
    default: op
  annachat.chat.color.hex:
    default: op
  annachat.chat.format.*:
    default: op
  "annachat.chat.format.&k":
    default: op
  "annachat.chat.format.&l":
    default: op
  "annachat.chat.format.&m":
    default: op
  "annachat.chat.format.&n":
    default: op
  "annachat.chat.format.&o":
    default: op
  "annachat.chat.format.&r":
    default: op
  annachat.chat.format.obfuscated:
    default: op
  annachat.chat.format.bold:
    default: op
  annachat.chat.format.strikethrough:
    default: op
  annachat.chat.format.underlined:
    default: op
  annachat.chat.format.italic:
    default: op
  annachat.chat.format.reset:
    default: op
  annachat.chat.mention:
    default: true
  annachat.chat.minimessage:
    default: op
  annachat.chat.placeholders:
    default: op
  annachat.format.group.*:
    default: false
  annachat.title.*:
    default: false
  annachat.bypass.cooldown:
    default: op
  annachat.bypass.filter:
    default: op
  annachat.bypass.moderation:
    # 默认连 OP 也参与审核；需要绕过时请显式授予此权限。
    default: false
  annachat.admin.reload:
    default: op
  annachat.admin.mute:
    default: op
  annachat.admin.spy:
    default: op
  annachat.admin.history:
    default: op
  annachat.admin.preview:
    default: op
  annachat.admin.notify:
    default: op
