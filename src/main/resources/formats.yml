# 格式由多个片段顺序拼接。type 可使用 text、message，附属插件可注册更多类型。
# text 片段：
#   content   MiniMessage 正文；同时支持传统 &0-&f、&k-&r 与 &x 十六进制颜色代码
#   hover     鼠标悬停文字列表
#   click     点击事件；action 可用 RUN_COMMAND、SUGGEST_COMMAND、OPEN_URL、COPY_TO_CLIPBOARD
#   insertion Shift+单击插入聊天框的文字
# message 片段：
#   style     玩家消息的外层 MiniMessage 样式
#
# 内置变量：{player} {display_name} {title} {group} {uuid} {world} {x} {y} {z}
#          {channel} {channel_display} {radius} {online}
# 自定义变量：{custom:键名}
# 同时支持 PlaceholderAPI，例如 %player_prefix%。
schema-version: 4
# 可选格式选择规则。按 priority 从小到大匹配，命中后使用 format 指向的格式。
# permission 与 group 可同时填写；group 使用 LuckPerms 主组名。
# format-rules:
#   - base-format: global
#     priority: 10
#     permission: annachat.format.group.admin
#     group: admin
#     format: global-admin
format-rules: []
formats:
  global:
    parts:
      - type: text
        content: '&8[<aqua>{channel_display}</aqua>&8] '
        hover:
          - '<gray>点击切换到全服频道</gray>'
        click:
          action: RUN_COMMAND
          value: '/annachat channel global'
      - type: text
        content: '<white>{title}{player}</white>'
        hover:
          - '<gray>玩家：<white>{player}</white></gray>'
          - '<gray>世界：<white>{world}</white></gray>'
          - '<gray>坐标：<white>{x}, {y}, {z}</white></gray>'
          - ''
          - '<aqua>点击填入私聊命令</aqua>'
        click:
          action: SUGGEST_COMMAND
          value: '/msg {player} '
        insertion: '{player}'
      - type: text
        content: '&8 » '
      - type: message
        style: '<gray>'

  local:
    parts:
      - type: text
        content: '&8[<yellow>{channel_display}</yellow>&8] '
        hover:
          - '<gray>仅 {radius} 格内玩家可见</gray>'
        click:
          action: RUN_COMMAND
          value: '/annachat channel local'
      - type: text
        content: '<white>{title}{player}</white>&8 » '
        hover:
          - '<gray>点击填入私聊命令</gray>'
        click:
          action: SUGGEST_COMMAND
          value: '/msg {player} '
      - type: message
        style: '<gray>'

  friends:
    parts:
      - type: text
        content: '&8[<#FFB7C5>好友</#FFB7C5>&8] '
        hover:
          - '<gray>仅你和在线好友可见</gray>'
        click:
          action: RUN_COMMAND
          value: '/annachat channel friends'
      - type: text
        content: '<white>{title}{player}</white>&8 » '
        hover:
          - '<gray>点击填入私聊命令</gray>'
        click:
          action: SUGGEST_COMMAND
          value: '/msg {player} '
      - type: message
        style: '<gray>'
